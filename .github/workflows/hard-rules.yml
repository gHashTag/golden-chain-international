name: hard-rules
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  banned-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: banned vocab scan
        run: |
          set -e
          PATTERN='breakthrough|revolutionary|first-ever|nobel|world-first|industry-leading|pseudoscience|crank|numerology'
          # A line carrying the sentinel below is exempt. This exists so that the
          # one place allowed to enumerate the forbidden vocabulary - the statement
          # of hard rule 9 itself - does not trip the gate that enforces it. Any
          # other line is scanned. Keep the sentinel off content lines.
          #
          # The file count is not decoration. W-INTL-153 was a CI step that passed
          # green having read nothing, and grep over a path that has been renamed
          # away reports no hits in exactly the same way as a clean scan. A gate
          # that cannot tell "scanned and clean" from "scanned nothing" is not one.
          SCANNED=$(find paper/ audits/ research/ plan/ README.md -type f 2>/dev/null | wc -l)
          if [ "$SCANNED" -lt 20 ]; then
            echo "::error::banned vocab scan saw only $SCANNED files; expected the"
            echo "::error::document tree - check the paths in this step"; exit 1
          fi
          HITS=$(grep -rniE "$PATTERN" paper/ audits/ research/ plan/ README.md 2>/dev/null \
                 | grep -v 'hard-rules:allow' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::banned vocabulary found"; exit 1
          fi
          echo "banned-words gate: OK ($SCANNED files scanned)"
      - name: non-ASCII scan (paper/ only)
        run: |
          set -e
          SCANNED=$(find paper/ -type f \( -name '*.md' -o -name '*.tex' \) | wc -l)
          if [ "$SCANNED" -lt 1 ]; then
            echo "::error::ascii scan matched no files under paper/"; exit 1
          fi
          if find paper/ -type f \( -name '*.md' -o -name '*.tex' \) -exec grep -lP '[^\x00-\x7F]' {} \; 2>/dev/null | grep -q .; then
            echo "::error::non-ASCII characters found in paper/"; exit 1
          fi
          echo "ascii-only gate: OK ($SCANNED files scanned)"
      - name: document consistency
        run: |
          set -e
          python3 scripts/check_consistency.py
          python3 scripts/check_figures_reproduce.py
      - name: commit claims
        run: |
          set -e
          python3 scripts/check_commit_claims.py \
            "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}" \
            --require-commits
      - name: every control still finds its anchor
        run: |
          set -e
          # Cheap, and it turns one stale anchor per five-minute CI round into all of
          # them at once. Run by hand before the last two pushes, which is the habit
          # W-INTL-157 says to hand to a machine.
          python3 scripts/check_control_anchors.py
      - name: the controls fire
        run: |
          set -e
          # A check that has never failed is a check nobody has tested. Each control
          # breaks one thing and asserts the check notices; the harness verifies the
          # mutation applied, disables bytecode caching so the mutation is visible, and
          # verifies the file was restored by hash.
          python3 scripts/control.py --self-test
          python3 scripts/control.py research/inputs.py \
            'SELECTION_LOSS = 1 - 381 / 701' 'SELECTION_LOSS = 0.0' \
            -- python3 scripts/check_figures_reproduce.py
          python3 scripts/control.py research/inputs.py \
            '# units: positions / positions' '' \
            -- python3 scripts/check_units.py
          python3 scripts/control.py paper/evidence_ledger.md \
            'decoder 24,659,' 'decoder 24,700,' \
            -- python3 scripts/check_figures_reproduce.py
          python3 scripts/control.py research/decoder_code_choice.md \
            'density after selection is 0.5889' 'density after selection is 0.9500' \
            -- python3 scripts/check_figures_reproduce.py
          # The margin column, restored to the figure it carried before W-INTL-224. That
          # value stood in the document for an interval with nothing able to contradict it.
          python3 scripts/control.py research/decoder_code_choice.md \
            '| **1.3x** |' '| **1.13x** |' \
            -- python3 scripts/check_figures_reproduce.py
          # A joint cell flipped from infeasible to feasible.
          python3 scripts/control.py research/decoder_code_choice.md \
            '| 0.6000 | 65% | 60% | 50% | 45% | --- |' \
            '| 0.6000 | 65% | 60% | --- | 45% | --- |' \
            -- python3 scripts/check_figures_reproduce.py
          # The density headroom rule, from both ends: the declared multiple and the
          # function that applies it. Either one silently reverting takes the design back
          # to sizing against a borrowed number with no margin - W-INTL-228.
          python3 scripts/control.py research/inputs.py \
            'DENSITY_HEADROOM = 1.25' 'DENSITY_HEADROOM = 1.00' \
            -- python3 scripts/check_figures_reproduce.py
          python3 scripts/control.py research/selection_entropy.py \
            'return I.MIN_ENTROPY_DENSITY / I.DENSITY_HEADROOM' \
            'return I.MIN_ENTROPY_DENSITY' \
            -- python3 scripts/check_figures_reproduce.py
          python3 scripts/control.py research/rtl/sllc127t7.v \
            'module sllc127t7_unmask' 'module sllc127t7_unmask2' \
            -- python3 scripts/check_generated_rtl.py
          python3 scripts/control.py research/rtl/measure_all.sh \
            '-DMVAL=8 -DTVAL=30' '-DMVAL=8 -DTVAL=99' \
            -- python3 scripts/check_testbench_coverage.py
          python3 scripts/control.py research/nand_ring.py \
            'if __name__ == "__main__":' 'if True:' \
            -- python3 scripts/check_module_hygiene.py
          python3 scripts/control.py STATUS.md \
            '# Status' '# Status (edited)' \
            -- python3 scripts/check_status_current.py
          python3 scripts/control.py paper/evidence_ledger.md \
            '  total        31 rows' '  total        30 rows' \
            -- python3 scripts/check_consistency.py
          python3 scripts/control.py research/decoder_code_choice.md \
            '`scripts/check_figures_reproduce.py` recomputes the headline from its inputs' \
            '`scripts/check_figures_reproduced.py` recomputes the headline from its inputs' \
            -- python3 scripts/check_consistency.py
          python3 scripts/control.py research/hub71_ai_competitor_matrix.md \
            '9.51 tok/s [PUB]' '9.51 tok/s' \
            -- python3 scripts/check_consistency.py
          python3 scripts/control.py paper/hub71_form_answers.md \
            '<!-- concedes: E26 -->' '' \
            -- python3 scripts/check_consistency.py
          python3 scripts/control.py research/constraint_register.md \
            '58 percent' '57 percent' \
            -- python3 scripts/check_figures_reproduce.py
          # The catalog lives in another repository. Fetched over https rather than
          # through the GitHub CLI, because the CLI needs a token the controls step does
          # not have - which is how the first run of this step failed. Four checks, four
          # controls; the fetch failing fails the step rather than skipping it.
          curl -fsSL -o /tmp/catalog.t27 \
            https://raw.githubusercontent.com/gHashTag/t27/master/specs/numeric/formats_catalog.t27
          test -s /tmp/catalog.t27
          # 'bias=15' alone matches three formats - binary16, fp8_e5m2 and gf14 - so it
          # names no site and control.py now refuses it. Qualified by the format it is
          # meant to break. W-INTL-230.
          for m in 'm=10 bias=15:m=10 bias=16' 'bits=16 s=1 e=5 m=10:bits=17 s=1 e=5 m=10' \
                   'id=binary16:id=binary32'; do
            python3 scripts/control.py /tmp/catalog.t27 "${m%%:*}" "${m##*:}" \
              -- python3 scripts/check_catalog.py /tmp/catalog.t27
          done
          python3 scripts/control.py /tmp/catalog.t27 \
            'name="binary16 (fp16, half)"' 'name="binary16 runs at 250 MHz"' \
            -- python3 scripts/check_catalog.py /tmp/catalog.t27
          # The probe number comes from the clock. Any fixed number, written anywhere -
          # this file, the audit, the document describing the control - lands in the diff
          # the check reads, and the check then finds the number it was told to look for.
          # That happened twice, in two different files. W-INTL-181.
          printf 'probe: closes W-INTL-%s\n' "$(date +%s)" > /tmp/probe_msg.txt
          if python3 scripts/check_commit_claims.py HEAD~1..HEAD \
               --message-file /tmp/probe_msg.txt --require-commits; then
            echo "::error::the commit-claims control did not fire"; exit 1
          fi
          echo "control on the commit message: the check FIRED"
      - name: the status page is current
        run: |
          set -e
          python3 scripts/check_status_current.py
      - name: no module computes on import
        run: |
          set -e
          python3 scripts/check_module_hygiene.py
      - name: every declared code has a testbench
        run: |
          set -e
          python3 scripts/check_testbench_coverage.py
      - name: generated RTL matches its generator
        run: |
          set -e
          python3 scripts/check_generated_rtl.py
      - name: no model writes down a figure the recommendation determines
        run: |
          set -e
          python3 scripts/check_no_stale_literals.py
          # Both forms it has actually appeared in: a tuple assignment, which the first
          # version of the check missed on its own control, and a bare determined value.
          python3 scripts/control.py research/key_generator_e2e.py \
            'T, K_BITS, BLOCKS = _recommended()' 'T, K_BITS, BLOCKS = 21, 29, 23' \
            -- python3 scripts/check_no_stale_literals.py
          python3 scripts/control.py research/borrowed_margins.py \
            'K_TOTAL = _k_total()' 'K_TOTAL = 228' \
            -- python3 scripts/check_no_stale_literals.py
      - name: the quantities with two derivations, and those with one
        run: |
          set -e
          python3 scripts/check_second_opinions.py
          python3 scripts/check_models_run.py --only min_entropy_from_shannon.py
          # An agreement quietly ceasing to be bound. W-INTL-245.
          # The historical defect itself: W-INTL-232's quadrature, which folded the drift
          # into the enrolment noise. It is an eight percent error, the flip-counting
          # estimator could not resolve it, and the conditional one catches it at nine
          # standard errors - W-INTL-247. This is the control that says the check would
          # have caught the last bug of its kind.
          python3 scripts/control.py research/reliable_bit_selection.py \
            '    tau2 = sigma_noise * sigma_noise / reads      # only the read noise is averaged' \
            '    tau2 = (sigma_noise * sigma_noise + sigma_age * sigma_age) / reads' \
            -- python3 scripts/check_second_opinions.py
          # The proven interval the fitted min-entropy sits inside.
          python3 scripts/control.py research/min_entropy_from_shannon.py \
            '    return _min_entropy_at_shannon(I.SHANNON_ENTROPY_BITS / I.MIN_ENTROPY_OVER)' \
            '    return 0.80' \
            -- python3 scripts/check_second_opinions.py
          # And the convexity that makes the distribution-free floor a floor rather than
          # a reading - inverted, the test reports 38 violations instead of none.
          python3 scripts/control.py research/min_entropy_from_shannon.py \
            '        if _min_entropy_at_shannon((lo + hi) / 2) > chord + 1e-12:' \
            '        if _min_entropy_at_shannon((lo + hi) / 2) < chord + 1e-12:' \
            -- python3 scripts/check_models_run.py --only min_entropy_from_shannon.py
      - name: every model pins a figure or says why not
        run: |
          set -e
          python3 scripts/check_models_run.py --only key_generator_e2e.py
          python3 scripts/check_models_run.py --only sllc_key_generator.py
          # A model that runs and pins nothing, dropping out of the list that records why.
          # Four were in that state and two were the two-witness argument. W-INTL-244.
          python3 scripts/control.py scripts/check_models_run.py \
            '    "code_choice_model.py":' '    "code_choice_model_x.py":' \
            -- python3 scripts/check_models_run.py --only nand_ring.py
          # And the chain exercising a construction other than the recommendation, which
          # is what it did for four moves of the design before W-INTL-229 found it. A
          # seed change is NOT the control here: the tolerance is wider than one standard
          # error of 300 trials, so it would pass, and the claim is the agreement rather
          # than the sample.
          python3 scripts/control.py research/key_generator_e2e.py \
            'T, K_BITS, BLOCKS = _recommended()' 'T, K_BITS, BLOCKS = 21, 29, 23' \
            -- python3 scripts/check_models_run.py --only key_generator_e2e.py
      - name: no figure depends on how finely it was asked for
        run: |
          set -e
          python3 scripts/check_quadrature_converged.py
          # Coarsening one integrator, which is what five call sites were unknowingly
          # doing by passing steps=600 to a function that needed 4,000. W-INTL-242.
          python3 scripts/control.py research/reliable_bit_selection.py \
            '    half = fraction / 2.0' \
            '    half = fraction / 2.0; steps = max(3, steps // 40)' \
            -- python3 scripts/check_quadrature_converged.py
          # A new resolution-taking function that nobody covered - the enumeration gap
          # this check closed in W-INTL-243, where six cases were listed and fourteen
          # such functions existed.
          python3 scripts/control.py research/burn_in.py \
            'def absorbed_at(pre_fraction):' 'def absorbed_at(pre_fraction, steps=100):' \
            -- python3 scripts/check_quadrature_converged.py
      - name: the ordering entropy computed exactly
        run: |
          set -e
          python3 scripts/check_models_run.py --only ordering_exact.py
          # Widening the systematic spread, which is what makes the orderings unequal and
          # is the whole reason the ceiling is not attained. W-INTL-241.
          python3 scripts/control.py research/ordering_exact.py \
            '    rng = random.Random(seed)' \
            '    rng = random.Random(seed); spread = spread * 3.0' \
            -- python3 scripts/check_models_run.py --only ordering_exact.py
          python3 scripts/control.py research/ordering_exact.py \
            '    rng = random.Random(seed)' \
            '    rng = random.Random(seed); spread = spread * 3.0' \
            -- python3 scripts/check_figures_reproduce.py
      - name: the ordering ceiling is not achievable
        run: |
          set -e
          python3 scripts/check_models_run.py --only ordering_achievable.py
          # Doubling the systematic spread, which is what makes the orderings unequal.
          # W-INTL-240.
          python3 scripts/control.py research/ordering_achievable.py \
            '        mu = sorted(rng.gauss(0.0, spread) for _ in range(oscillators))' \
            '        mu = sorted(rng.gauss(0.0, spread * 2.0) for _ in range(oscillators))' \
            -- python3 scripts/check_models_run.py --only ordering_achievable.py
          # And accepting the rows the estimator's own validity test rejects, which is the
          # difference between an answer and an impossible one.
          python3 scripts/control.py research/ordering_achievable.py \
            '            max(ratios) <= 1.0)' '            True)' \
            -- python3 scripts/check_models_run.py --only ordering_achievable.py
      - name: the accounting fits under the ordering ceiling
        run: |
          set -e
          python3 scripts/check_models_run.py --only ordering_ceiling.py
          # Shrinking the ceiling until the accounting exceeds it, which is the condition
          # oscillator_floor cannot see because it compares against the key size instead.
          # W-INTL-239.
          python3 scripts/control.py scripts/check_figures_reproduce.py \
            '    ceiling = lgamma(oscillators + 1) / log(2.0)' \
            '    ceiling = lgamma(oscillators - 15) / log(2.0)' \
            -- python3 scripts/check_figures_reproduce.py
          # And moving the oscillator count the ceiling is computed from.
          python3 scripts/control.py research/ordering_ceiling.py \
            '    oscillators = max(S.floor_ent(I.KEY_BITS), S._r(raw))' \
            '    oscillators = max(S.floor_ent(I.KEY_BITS), S._r(raw)) + 6' \
            -- python3 scripts/check_models_run.py --only ordering_ceiling.py
      - name: the post-selection density has a second derivation
        run: |
          set -e
          python3 scripts/check_models_run.py --only entropy_second_opinion.py
          # Dropping the conditioning on selection, which is the mistake the first
          # version of that file made and would have reported as a 0.116 discrepancy.
          # W-INTL-238.
          python3 scripts/control.py research/entropy_second_opinion.py \
            '        weighted += survives * _min_entropy(up / survives)' \
            '        weighted += survives * _min_entropy(1.0 - ND.cdf(-t))' \
            -- python3 scripts/check_models_run.py --only entropy_second_opinion.py
          # And moving the published figure the spread is fitted to, which must move both
          # derivations and the gap between them.
          python3 scripts/control.py research/inputs.py \
            'SHANNON_ENTROPY_BITS = 241.0' 'SHANNON_ENTROPY_BITS = 230.0' \
            -- python3 scripts/check_models_run.py --only entropy_second_opinion.py
      - name: two enrolment temperatures beat one
        run: |
          set -e
          python3 scripts/check_models_run.py --only multi_condition_enrolment.py
          # Ranking on the nominal condition alone, which is what the design does today.
          # W-INTL-237.
          python3 scripts/control.py research/multi_condition_enrolment.py \
            '        score = min(abs(nominal), abs(extreme)) if conditions == 2 else abs(nominal)' \
            '        score = abs(nominal)' \
            -- python3 scripts/check_models_run.py --only multi_condition_enrolment.py
          # And breaking the closed-form model, which this Monte Carlo agrees with at the
          # case they share - the one model-against-model cross-check in the project.
          python3 scripts/control.py research/reliable_bit_selection.py \
            '    tau2 = sigma_noise * sigma_noise / reads      # only the read noise is averaged' \
            '    tau2 = (sigma_noise * sigma_noise + sigma_age * sigma_age) / reads' \
            -- python3 scripts/check_models_run.py --only multi_condition_enrolment.py
      - name: the budget is audited for absent terms
        run: |
          set -e
          python3 scripts/check_models_run.py --only budget_audit.py
          # Reporting the worst corner uncorrelated, which is the optimistic end and the
          # assumption W-INTL-235 made without pricing it. W-INTL-236.
          python3 scripts/control.py research/budget_audit.py \
            '    worst = best_over_fractions(I.TEMPERATURE_FLIP_WORST, 1.0)' \
            '    worst = best_over_fractions(I.TEMPERATURE_FLIP_WORST, 0.0)' \
            -- python3 scripts/check_models_run.py --only budget_audit.py
          # And dropping the correlation term from the combined drift entirely.
          python3 scripts/control.py research/budget_audit.py \
            '    return sqrt(age * age + temp * temp + 2 * correlation * age * temp)' \
            '    return sqrt(age * age + temp * temp)' \
            -- python3 scripts/check_models_run.py --only budget_audit.py
      - name: the error budget carries an environmental term
        run: |
          set -e
          python3 scripts/check_models_run.py --only environmental_margin.py
          # Moving the worst-chip figure, which the free-headroom row does not depend on -
          # W-INTL-235, and the reason a second figure is bound for this model.
          python3 scripts/control.py research/inputs.py \
            'TEMPERATURE_FLIP_WORST = 0.11' 'TEMPERATURE_FLIP_WORST = 0.14' \
            -- python3 scripts/check_models_run.py --only environmental_margin.py
          # And the same two inputs where a document carries them, which is what makes
          # them visible to the coverage sweep at all - W-INTL-235.
          python3 scripts/control.py research/inputs.py \
            'TEMPERATURE_FLIP_TYPICAL = 0.0263' 'TEMPERATURE_FLIP_TYPICAL = 0.04' \
            -- python3 scripts/check_figures_reproduce.py
          # Dropping the aging term from the combined drift.
          python3 scripts/control.py research/environmental_margin.py \
            '    drift = sqrt(R.sigma_for_raw_ber(I.AGED_FLIP_RESISTANT) ** 2' \
            '    drift = 0.0 * sqrt(R.sigma_for_raw_ber(I.AGED_FLIP_RESISTANT) ** 2' \
            -- python3 scripts/check_models_run.py --only environmental_margin.py
      - name: burn-in widens the difference selection ranks on
        run: |
          set -e
          python3 scripts/check_models_run.py --only burn_in.py
          # Removing the widening term, which is what burn_in.py assumed for six loops.
          # W-INTL-234.
          python3 scripts/control.py research/reliable_bit_selection.py \
            '    scale = math.sqrt(1.0 + sigma_age * sigma_age * pre_fraction)' \
            '    scale = 1.0' \
            -- python3 scripts/check_models_run.py --only burn_in.py
          # A determined figure returned bare from a function that names it.
          python3 scripts/control.py research/pointer_vs_linear.py \
            '    return S.recommended_code()[3]' '    return 6' \
            -- python3 scripts/check_no_stale_literals.py
      - name: every declared area is re-measurable or recorded as not
        run: |
          set -e
          python3 scripts/check_areas_reverifiable.py
          # A declared area dropping out of the recorded set, and a new one appearing
          # outside both sets. W-INTL-233.
          python3 scripts/control.py scripts/check_areas_reverifiable.py \
            '    "TILE_AREA":' '    "TILE_AREA_X":' \
            -- python3 scripts/check_areas_reverifiable.py
          python3 scripts/control.py research/inputs.py \
            'SLLC_AREA = ' 'SLLC_AREA_X = ' \
            -- python3 scripts/check_areas_reverifiable.py
      - name: the drift is not read noise
        run: |
          set -e
          # Restoring the quadrature that folded the ten-year drift into the enrolment
          # noise, where twenty-five reads average away a drift that has not happened yet.
          # W-INTL-232.
          python3 scripts/control.py research/reliable_bit_selection.py \
            '    tau2 = sigma_noise * sigma_noise / reads      # only the read noise is averaged' \
            '    tau2 = (sigma_noise * sigma_noise + sigma_age * sigma_age) / reads' \
            -- python3 scripts/check_figures_reproduce.py
      - name: the entropy figure is a min-entropy
        run: |
          set -e
          python3 scripts/check_models_run.py --only min_entropy_from_shannon.py
          # Restoring the published Shannon figure under the min-entropy name is the
          # defect W-INTL-231 corrected; it stood for thirty loops.
          python3 scripts/control.py research/inputs.py \
            'MIN_ENTROPY_BITS = 183.3' 'MIN_ENTROPY_BITS = 241.0' \
            -- python3 scripts/check_figures_reproduce.py
          python3 scripts/control.py scripts/check_figures_reproduce.py \
            '    k_total = _rec[2] * _rec[4] if _rec else 0' '    k_total = 342' \
            -- python3 scripts/check_no_stale_literals.py
      - name: every declared input is read
        run: |
          set -e
          python3 scripts/check_inputs_are_read.py
      - name: units on every ratio
        run: |
          set -e
          python3 scripts/check_units.py
      - name: catalog rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 scripts/check_catalog.py

  synthesis-verification:
    # The other half of measure_all.sh. Every declared area is re-synthesised against the
    # standard-cell library and compared with what research/inputs.py says it is - the
    # check that caught two areas declared under the wrong solver convention, one loop
    # after they were merged, because it ran only when somebody remembered.
    #
    # It needs the liberty, which is 12.8 MB of PDK and is not in this repository. Fetched
    # from the SkyWater cell library mirror and cached. If the fetch fails the job fails:
    # a synthesis check that silently skips is the failure mode of W-INTL-153.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install iverilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: cache the pinned yosys
        id: oss
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-20260730
      - name: install the pinned yosys
        if: steps.oss.outputs.cache-hit != 'true'
        run: |
          set -e
          # The distribution's yosys is a different version, and a synthesis area is a
          # property of the tool as much as of the circuit: the first run of this job
          # reported all twenty-two areas as mismatches by up to seven percent, with
          # nothing wrong with the circuits. research/inputs.py declares the version and
          # verify_inputs.py refuses to compare against a different one.
          curl -fsSL -o /tmp/oss.tgz \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-07-30/oss-cad-suite-linux-x64-20260730.tgz
          sudo mkdir -p /opt && sudo tar -xzf /tmp/oss.tgz -C /opt
      - name: put the pinned yosys on the path
        run: echo "/opt/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: cache the standard-cell liberty
        id: liberty
        uses: actions/cache@v4
        with:
          path: /tmp/sky130.lib
          key: sky130-fd-sc-hd-tt-025C-1v80-v1
      - name: fetch the standard-cell liberty
        if: steps.liberty.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -fsSL -o /tmp/sky130.lib \
            https://raw.githubusercontent.com/efabless/skywater-pdk-libs-sky130_fd_sc_hd/master/timing/sky130_fd_sc_hd__tt_025C_1v80.lib
          test -s /tmp/sky130.lib
          head -1 /tmp/sky130.lib | grep -q 'sky130_fd_sc_hd__tt_025C_1v80'
      - name: every declared area re-synthesised
        run: |
          set -e
          # The tolerance is now measured rather than guessed. Under the pinned build,
          # 19 of the 22 declared areas reproduce exactly and three differ by at most
          # 0.26 percent - all three the shared-multiplier solver, the one circuit with
          # resource sharing for the mapper to exploit differently. The seven percent
          # spread that motivated a tolerance at all came from the distribution's much
          # older yosys, not from version drift as such. One percent, against a measured
          # worst case of 0.26. Exact comparison remains the local run.
          python3 scripts/verify_inputs.py --tolerance-percent 1

  models-run:
    # Two minutes, so not in the fast job. Nothing here executed the files that do the
    # reasoning until W-INTL-202, and one of them had not run since the decoder areas
    # were re-keyed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache the standard-cell liberty
        id: liberty
        uses: actions/cache@v4
        with:
          path: /tmp/sky130.lib
          key: sky130-fd-sc-hd-tt-025C-1v80-v1
      - name: fetch the standard-cell liberty
        if: steps.liberty.outputs.cache-hit != 'true'
        run: |
          set -e
          # nand_ring.py reads cell areas from the liberty and degrades gracefully when it
          # is absent - it prints "nothing measured, nothing claimed" and exits zero. That
          # passes "the model runs" and fails "the model produced its figure", which is
          # the difference between the two checks, demonstrated on the first CI run of the
          # second one. W-INTL-204.
          curl -fsSL -o /tmp/sky130.lib \
            https://raw.githubusercontent.com/efabless/skywater-pdk-libs-sky130_fd_sc_hd/master/timing/sky130_fd_sc_hd__tt_025C_1v80.lib
          test -s /tmp/sky130.lib
      - name: install what the models need
        run: python3 -m pip install --quiet -r requirements.txt
      - name: every model still runs
        run: |
          set -e
          python3 scripts/check_models_run.py
      - name: the model controls fire
        run: |
          set -e
          # These invoke check_models_run, which takes four minutes. Leaving them in the
          # document job took it to thirteen - the third time W-INTL-195 has arrived, so
          # they live beside the check they exercise.
          python3 scripts/control.py research/code_choice_model.py \
            '(8, 18)' '(8, 99)' \
            -- python3 scripts/check_models_run.py --only code_choice_model.py
          python3 scripts/control.py research/nand_ring.py \
            'nand / inv:.4f' 'nand / inv * 2:.4f' \
            -- python3 scripts/check_models_run.py --only nand_ring.py
          # 171 rather than 228: the control has to change the figure, and 228 is what
          # the recommendation currently carries. The literal-228 mutation is a control
          # for check_no_stale_literals instead, where being the right value is the point.
          # The cell area written down rather than derived, which is how borrowed_margins
          # carried 35,905 across two design moves - W-INTL-233.
          python3 scripts/control.py research/borrowed_margins.py \
            'CELLS, OSCILLATORS = _cells_and_oscillators()' 'CELLS, OSCILLATORS = 36686, 54' \
            -- python3 scripts/check_no_stale_literals.py
          python3 scripts/control.py research/borrowed_margins.py \
            'K_TOTAL = _k_total()' 'K_TOTAL = 171' \
            -- python3 scripts/check_models_run.py --only borrowed_margins.py
          # Drops the selection term from the density floor, which is the bug this model
          # shipped with for one interval: it made the margin read 1.26 instead of 1.13.
          python3 scripts/control.py research/borrowed_margins.py \
            'after = SE.density_for_bias(SE.selected_bias(SE.mean_for_density(mid), 1 - keep)[0])' \
            'after = mid' \
            -- python3 scripts/check_models_run.py --only borrowed_margins.py
          python3 scripts/control.py research/selection_with_bch.py \
            'if m == 7 and not AM.meets_aging_headroom(t, k, blocks):' 'if False:' \
            -- python3 scripts/check_models_run.py --only selection_with_bch.py


  input-coverage:
    # Split out of the document job in W-INTL-195. Perturbing thirteen inputs and
    # re-running two checks each took the fast job from twelve seconds to ten minutes and
    # forty-four, which makes every unrelated documentation change wait on a sensitivity
    # sweep. It is the right check and the wrong place for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every input is covered by a check
        run: |
          set -e
          python3 scripts/check_input_coverage.py

  rtl-verification:
    # Every area this project quotes is quoted for a circuit that decoded correctly, and
    # for eighty loops that rule was enforced by whoever remembered to run measure_all.sh.
    # The verification half needs only iverilog, so it runs here. The synthesis half needs
    # a 13 MB standard-cell liberty that is not in this repository, and does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install iverilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: every testbench
        run: |
          set -e
          bash research/rtl/measure_all.sh --verify-only
